# Render Blueprint: one Node web service that serves both the API and the static frontend.
# MySQL is hosted elsewhere (Render does not offer managed MySQL); see README > Deployment.
# Secrets marked `sync: false` are entered in the Render dashboard, never committed.
services:
  - type: web
    name: maintainiq
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: DB_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      # Public demo: protects the seeded demo data and shows the demo password on the login page.
      - key: DEMO_MODE
        value: "true"
      # Deliberately public, but entered in the dashboard so it matches the nightly reset's password.
      - key: DEMO_PASSWORD
        sync: false
